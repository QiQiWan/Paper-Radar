<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-label="来源授权分层">
<rect width="1000" height="270" rx="20" fill="#f6f9fc"/>
<text x="46" y="45" font-size="24" font-family="sans-serif" font-weight="700" fill="#203544">来源授权分层</text>
<text x="46" y="74" font-size="15" font-family="sans-serif" fill="#617a89">区分公开题录、开放 PDF 和需授权的出版社接口</text>
<rect x="46.0" y="105" width="201.0" height="100" rx="14" fill="#fff" stroke="#cbdde8" stroke-width="2"/>
<circle cx="71.0" cy="132" r="14" fill="#e7f3f7"/>
