<text x="92.0" y="137" font-size="18" font-weight="600" fill="#203544" font-family="sans-serif">公共接口</text>
<text x="65.0" y="180" font-size="14" fill="#54707f" font-family="sans-serif">arXiv / OpenAlex</text>
<path d="M 253.0 151 l 8 -6 l 0 12 z" fill="#8aa6b5"/>
<rect x="269.0" y="105" width="201.0" height="100" rx="14" fill="#fff" stroke="#cbdde8" stroke-width="2"/>
<circle cx="294.0" cy="132" r="14" fill="#e7f3f7"/>
<text x="294.0" y="138" text-anchor="middle" font-size="16" fill="#0b6880" font-family="sans-serif">2</text>
<text x="315.0" y="137" font-size="18" font-weight="600" fill="#203544" font-family="sans-serif">题录聚合</text>
<text x="288.0" y="180" font-size="14" fill="#54707f" font-family="sans-serif">Crossref / DOI</text>
<path d="M 476.0 151 l 8 -6 l 0 12 z" fill="#8aa6b5"/>
<rect x="492.0" y="105" width="201.0" height="100" rx="14" fill="#fff" stroke="#cbdde8" stroke-width="2"/>
<circle cx="517.0" cy="132" r="14" fill="#e7f3f7"/>
<text x="517.0" y="138" text-anchor="middle" font-size="16" fill="#0b6880" font-family="sans-serif">3</text>
<text x="538.0" y="137" font-size="18" font-weight="600" fill="#203544" font-family="sans-serif">机构授权</text>
<text x="511.0" y="180" font-size="14" fill="#54707f" font-family="sans-serif">出版社 API 权限</text>
<path d="M 699.0 151 l 8 -6 l 0 12 z" fill="#8aa6b5"/>
<rect x="715.0" y="105" width="201.0" height="100" rx="14" fill="#fff" stroke="#cbdde8" stroke-width="2"/>
<circle cx="740.0" cy="132" r="14" fill="#e7f3f7"/>
<text x="740.0" y="138" text-anchor="middle" font-size="16" fill="#0b6880" font-family="sans-serif">4</text>
<text x="761.0" y="137" font-size="18" font-weight="600" fill="#203544" font-family="sans-serif">全文核查</text>
<text x="734.0" y="180" font-size="14" fill="#54707f" font-family="sans-serif">合法获取的 PDF</text>
<text x="50" y="243" font-size="15" font-family="sans-serif" fill="#48677a">能检索到题录，不代表拥有付费全文下载权限。</text>
