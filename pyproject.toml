[project]
name = "paper-radar-local"
version = "1.52.1"
description = "Local research paper discovery, Zotero topic matching, local PDF evidence reading and reports"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "EatRice"}]
dependencies = ["python-docx>=1.1,<2", "keyring>=25,<27", "pypdf>=5,<7", "cryptography>=43,<48", "PyMuPDF>=1.24,<2", "tomli>=2,<3; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/QiQiWan/Paper-Radar"
Repository = "https://github.com/QiQiWan/Paper-Radar"
Issues = "https://github.com/QiQiWan/Paper-Radar/issues"
Documentation = "https://github.com/QiQiWan/Paper-Radar/tree/main/docs"

[project.optional-dependencies]
pdf_layout = ["PyMuPDF>=1.24,<2"]
dev = ["pytest>=8,<10", "PyYAML>=6,<7", "beautifulsoup4>=4.12,<5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["paper_radar*"]

[tool.setuptools.package-data]
paper_radar = ["static/*.html", "static/*.css", "static/*.js"]
