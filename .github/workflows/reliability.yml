name: Stability and continuous-following acceptance
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-following:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime and pytest
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest pyyaml "pymupdf>=1.24,<2"
      - name: Follow tracking, backup/restore, account isolation and 1.34 compatibility
        run: |
          python -m pytest -q tests/test_v135_stability.py tests/test_v136_following.py tests/test_v136_portal_following.py tests/test_v1342_full_parity.py tests/test_v139_sources_evidence_zotero.py tests/test_v139_integration_and_eval.py tests/test_v1402_retrieval_diagnostics.py
      - name: Check runtime and repositories
        run: |
          python -m tools.packaging.feature_parity
          python -m tools.packaging.check_github_workflows
          python -m tools.packaging.release_version
          python -m compileall -q paper_radar main.py startup.py
      - name: One thousand synthetic papers, real SQLite and authenticated HTTP
        run: python -m tools.v136_following_benchmark --requests 160 --workers 6 --soak 8 --output following-acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: following-${{ matrix.os }}-${{ matrix.python-version }}
          path: following-acceptance.json
          if-no-files-found: ignore
          retention-days: 30
