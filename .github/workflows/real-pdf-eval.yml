name: Real PDF 30-paper benchmark acquisition
on:
  push:
    branches: [benchmark/real-pdf-eval-30]
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "pymupdf>=1.24,<2"
      - name: Download and validate fixed arXiv PDFs
        run: python tools/benchmarks/acquire_30_real_pdfs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arxiv-pdf-eval-manifest
          path: real_pdf_acquisition/download_manifest.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arxiv-pdf-research-copy-01
          path: real_pdf_acquisition/pdfs/01/*.pdf
          if-no-files-found: warn
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arxiv-pdf-research-copy-02
          path: real_pdf_acquisition/pdfs/02/*.pdf
          if-no-files-found: warn
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arxiv-pdf-research-copy-03
          path: real_pdf_acquisition/pdfs/03/*.pdf
          if-no-files-found: warn
          retention-days: 1
