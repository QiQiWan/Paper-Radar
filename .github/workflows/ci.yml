name: Tests
on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Offline Agent doctor
        run: python -m paper_radar.agents doctor
      - name: JavaScript syntax
        run: |
          node --check paper_radar/static/app.js
          node --check paper_radar/static/portal.js
      - name: Compile check
        run: python -m compileall -q paper_radar main.py

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Windows isolation, portal and cloud-failure smoke
        run: python -m pytest -q tests/test_v1211_fixes.py tests/test_v1212_stability.py tests/test_v118_public_pipeline.py tests/test_v122_fulltext_and_synthesis.py
      - name: Windows source and parser entrypoint compile check
        run: python -m compileall -q paper_radar main.py startup.py
