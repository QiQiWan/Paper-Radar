# Replace the domain, certs and backend port. Expose only Nginx 443 publicly.
server {
    listen 80;
    server_name papers.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name papers.example.com;
    ssl_certificate /etc/letsencrypt/live/papers.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/papers.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 400k;
    # The API accepts PDFs up to 32 MiB; only this exact endpoint gets a larger limit.
    # An HTTP 413 generated by Nginx is caught by portal.js and displayed plainly.
    location = /api/public/pdf {
        client_max_body_size 34m;
        proxy_pass http://127.0.0.1:8899;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass http://127.0.0.1:8899;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}
